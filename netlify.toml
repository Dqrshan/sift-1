[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = ".next/standalone/"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  BUN_VERSION = "1.3"
  BUN_INSTALL = "true"

[[redirects]]
  from = "/*"
  to = "/server.js"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

